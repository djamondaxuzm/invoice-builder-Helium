appId: com.invoice-builder
productName: Invoice Builder Helium
executableName: Invoice Builder

directories:
  output: release

publish:
  provider: github
  owner: djamondaxuzm
  repo: invoice-builder-Helium

files:
  - dist-fe/**
  - dist-be/**
  - node_modules/**
  - package.json
  - LICENSE
  - LICENSE-DISCLAIMER.md

extraMetadata:
  main: dist-be/backend/main/main.cjs

forceCodeSigning: false

afterPack: scripts/after-pack.cjs

win:
  icon: src/backend/main/assets/icon.ico
  target:
    - nsis

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false

linux:
  target:
    - deb
    - AppImage
  category: Office
  maintainer: 'djamondaxuzm'
  icon: 'src/backend/main/assets/linux-icons'

mac:
  target:
    - dmg
  category: public.app-category.productivity
  icon: 'src/backend/main/assets/macos-icons/icon.icns'

dmg:
  contents:
    - type: file
      x: 130
      y: 220
    - type: link
      x: 410
      y: 220
      path: /Applications
